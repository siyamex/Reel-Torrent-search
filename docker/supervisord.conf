[supervisord]
nodaemon=true
user=root

; Starts first (lowest priority number) so redis is up before the backend
; tries to connect to it. The backend's own Redis-or-fallback logic would
; survive a brief race anyway, but this avoids it entirely.
[program:redis]
command=redis-server --appendonly yes --dir /data --bind 127.0.0.1
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=node dist/server.js
directory=/app/backend
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/start-nginx.sh
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
